name: Validate life map

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check fast-app.js
          node --check polish.js
          node --check conference-display.js
          node --check labels.js
          node --check bootstrap.js
          node --check map-performance.js
          node --check map-theme.js
          node --check app.js
          node --check integration.js
          node --check story.js
          node --check editorial-ui.js

      - name: Validate map data and production frontend
        run: |
          python scripts/validate_data.py
          python scripts/validate_stories.py
          python scripts/validate_conferences.py
          python scripts/validate_frontend.py
