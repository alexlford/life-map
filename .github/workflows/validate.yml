name: Validate life map

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check map-theme.js
          node --check app.js
          node --check integration.js
          node --check story.js

      - name: Validate map data
        run: |
          python scripts/validate_data.py
          python scripts/validate_stories.py
