<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#04131f" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="An interactive geographic timeline of the places that have shaped Alex Ford's life, education, and professional work." />
  <title>Life Map | Alex Ford</title>
  <link rel="dns-prefetch" href="//a.basemaps.cartocdn.com" />
  <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
  <link rel="stylesheet" href="./fast-app.css?v=20260810-1722" />
  <script defer src="./fast-app.js?v=20260810-1722"></script>
</head>
<body>
  <main class="app">
    <header class="site-intro">
      <small>Alex Ford · Personal Atlas</small>
      <strong>Life Map</strong>
    </header>

    <div id="map" class="fast-map" role="application" aria-label="Interactive geographic map">
      <div id="tiles" class="tile-layer" aria-hidden="true"></div>
      <div class="map-vignette" aria-hidden="true"></div>
      <div id="markers" class="marker-layer"></div>
      <div class="attribution">© OpenStreetMap contributors · © CARTO</div>
    </div>

    <nav id="modeSwitch" class="mode-switch" aria-label="Map view">
      <button type="button" data-mode="combined" aria-pressed="false">Combined</button>
      <button type="button" data-mode="life" aria-pressed="false">Life</button>
      <button type="button" data-mode="work" aria-pressed="false">Work</button>
    </nav>

    <div class="map-toolbar" aria-label="Map controls">
      <button id="zoomOut" class="map-tool" type="button" aria-label="Zoom out">−</button>
      <button id="zoomIn" class="map-tool" type="button" aria-label="Zoom in">+</button>
      <button id="reset" class="map-tool wide" type="button">Reset view</button>
    </div>

    <aside class="panel" aria-label="Journey controls">
      <div class="panel-head">
        <div><small>Alex Ford · Experience</small><h1 id="panelTitle">Explore the journey</h1></div>
        <div class="count" aria-live="polite"><strong id="count">0</strong><span>places</span></div>
      </div>

      <section id="journey" class="journey">
        <div class="journey-heading"><span>Career chapters</span><span>Select to zoom</span></div>
        <div id="chapters" class="chapters"></div>
      </section>

      <div class="panel-scroll">
        <div class="search-wrap">
          <label class="search" for="search"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="Search a place or experience" /></label>
          <div id="searchResults" class="search-results" hidden></div>
        </div>

        <section class="section">
          <div class="section-title"><h2>Show on map</h2><button id="showAll" class="text-button" type="button">Show all</button></div>
          <div id="filters" class="filters"></div>
        </section>

        <section class="section">
          <div class="section-title"><h2>Timeline</h2><button id="timelineToggle" class="text-button" type="button" aria-pressed="false">Use timeline</button></div>
          <div class="timeline-row"><input id="timeline" type="range" min="1988" max="2026" value="2026" disabled aria-label="Show experiences through year" /><span id="timelineYear" class="timeline-year">Present</span></div>
          <p id="timelineNote" class="micro">Turn on the timeline to build the journey year by year.</p>
        </section>

        <section class="section">
          <div class="section-title"><h2>Places</h2></div>
          <div id="list" class="place-list"><div class="empty">Loading locations…</div></div>
        </section>
      </div>
    </aside>

    <aside id="detail" class="detail-panel" aria-live="polite" aria-label="Place details" hidden>
      <button class="detail-close" type="button" data-close-detail aria-label="Close details">×</button>
      <div id="detailBody"></div>
    </aside>

    <noscript><div class="empty">JavaScript is required to display the interactive locations.</div></noscript>
  </main>
</body>
</html>
